name: Game Changers drift

on:
  schedule:
    # Monday 12:00 UTC. Reads the Scryfall oracle bulk. No secrets.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Compare game_changers.json to the oracle bulk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compare Game Changer names
        id: compare
        working-directory: api
        run: |
          set +e
          python -m app.scripts.check_game_changer_drift
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$code"

      - name: Open an issue when the list drifted
        if: failure() && steps.compare.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Game Changers list drifted from the Scryfall oracle bulk";
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            const body = [
              "The weekly check found that `api/app/data/game_changers.json` does not match the `game_changer` field on the Scryfall oracle-cards bulk.",
              "",
              "The job only reads the bulk. It does not rewrite the file.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Regenerate locally with `python -m app.scripts.build_precon_facts --refresh-bulk --write-game-changers` and review the diff. A write is refused if the new list has fewer than 40 names or changes more than 25% of the committed names.",
            ].join("\n");
            const open = found.data.items[0];
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
