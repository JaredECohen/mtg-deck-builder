# Fly.io app for the API (docs/DEPLOY.md). Set `app` to your Fly app name.
app = "mtg-deck-lab-api"
primary_region = "iad"
# Must stay top-level: below a [section] header TOML scopes it to that table and
# Fly silently ignores it. 1 GB was not enough on Fly: uvicorn reached ~880 MB
# during warm-up on the throttled shared CPU and was OOM-killed even with swap.
swap_size_mb = 512

[build]
  dockerfile = "api/Dockerfile"

[env]
  LOG_LEVEL = "INFO"
  MTG_WARM_CACHES = "1"
  # Public API behind the Vercel proxy: X-Forwarded-For is trusted only on
  # requests that carry MTG_API_KEY (set as a secret), so leave this off.
  MTG_TRUST_FORWARDED = "0"

[[mounts]]
  source = "mtg_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the one machine running: caches take ~10 s to rebuild after a stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    # First boot builds the database (10-15 min on a shared CPU; profiling is
    # the slow step). Fly keeps the machine running while checks fail.
    grace_period = "180s"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
